<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mythara · Prototyp Heldenfreischaltung</title>
<style>
@font-face { font-family: "Cinzel"; src: url("../../portal/fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Inter"; src: url("../../portal/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../../portal/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Cormorant Garamond"; src: url("../fonts/cormorant-garamond-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
:root { --gold: #d9b26a; --gold-hell: #f6dc9c; --gold-dunkel: #7a5a26; --text: #ece4d4; --leise: #a89f8e; --nacht: #07080b; }
* { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; background: var(--nacht); }
body { font-family: Inter, system-ui, sans-serif; color: var(--text); overflow-x: hidden;
  background: radial-gradient(90% 60% at 50% 0%, rgba(90,70,40,.22), transparent 60%), linear-gradient(180deg, #11131a, #07080b 70%) fixed; }
button { font: inherit; color: inherit; cursor: pointer; }
.titelschrift { font-family: Cinzel, serif; font-weight: 600; }

/* Kopf mit Ansichten */
.kopf { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 20px; background: rgba(7,8,11,.86); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(217,178,106,.25); }
.logo { font: 600 22px Cinzel, serif; letter-spacing: .1em; background: linear-gradient(180deg, #fff1c8, #d9a64a 55%, #8a5d1e); -webkit-background-clip: text; background-clip: text; color: transparent; }
.proto { font-size: 11px; letter-spacing: .2em; color: var(--leise); text-transform: uppercase; }
.ansichten { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px; border-radius: 12px; background: rgba(0,0,0,.4); box-shadow: inset 0 0 0 1px rgba(217,178,106,.2); }
.ansichten button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--leise); }
.ansichten button.an { color: #fff; background: linear-gradient(180deg, #8a2a24, #5a1612); box-shadow: inset 0 0 0 1px rgba(255,160,140,.35); }
.zaehler { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--leise); }
.zaehler b { font: 600 20px Cinzel, serif; color: var(--gold-hell); }
.zaehler .ring { width: 38px; height: 38px; }
.link { border: 0; background: none; color: var(--leise); text-decoration: underline; font-size: 12px; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 80px; }
.ansicht[hidden] { display: none; }
.eyebrow { font: 600 12px Cinzel, serif; letter-spacing: .35em; color: var(--gold); text-transform: uppercase; text-align: center; }
h1.gross { font: 600 clamp(30px, 4vw, 48px)/1.1 Cinzel, serif; text-align: center; margin: 8px 0 6px; background: linear-gradient(180deg, #fff6dc, #f0d08a 50%, #b88a3e); -webkit-background-clip: text; background-clip: text; color: transparent; }
.unter { font: italic 20px "Cormorant Garamond", serif; color: var(--leise); text-align: center; max-width: 720px; margin: 0 auto; }
.zier { width: 220px; height: 14px; margin: 14px auto 6px; background: linear-gradient(90deg, transparent, rgba(217,178,106,.75), transparent) center / 100% 1px no-repeat, radial-gradient(circle, #f6dc9c 0 3px, transparent 4px) center / 14px 14px no-repeat; }
.runden { display: flex; justify-content: center; gap: 10px; margin: 14px 0 0; }
.runden i { width: 46px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); }
.runden i.fertig { background: linear-gradient(90deg, #b8742a, #ffd27a); box-shadow: 0 0 10px rgba(255,190,90,.5); }
.runden i.jetzt { background: rgba(246,220,156,.55); }

/* Drei Karten nebeneinander, die sich aufdrehen */
.buehne { display: flex; justify-content: center; gap: clamp(14px, 3vw, 40px); margin: 34px 0 10px; perspective: 1400px; flex-wrap: wrap; }
.karte { position: relative; width: clamp(210px, 25vw, 290px); aspect-ratio: 5 / 7.4; cursor: pointer; transition: transform .35s ease; }
.karte .innen { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.2,.8,.2,1); }
.karte.verdeckt .innen { transform: rotateY(180deg) scale(.82); }
.karte:not(.verdeckt):hover { transform: translateY(-8px); }
.karte:not(.verdeckt):hover .vorne { box-shadow: 0 0 0 2px var(--gold-hell), 0 0 40px rgba(246,200,110,.45), 0 30px 60px rgba(0,0,0,.6); }
.vorne, .hinten { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.hinten { transform: rotateY(180deg); background:
  radial-gradient(circle at 50% 45%, rgba(246,220,156,.22), transparent 45%),
  repeating-linear-gradient(45deg, rgba(217,178,106,.07) 0 2px, transparent 2px 14px),
  linear-gradient(160deg, #2a2117, #0d0c0b);
  box-shadow: 0 0 0 2px #6e4e1c, inset 0 0 0 8px rgba(0,0,0,.4), inset 0 0 0 9px rgba(217,178,106,.4), 0 20px 50px rgba(0,0,0,.6); display: grid; place-items: center; }
.hinten span { font: 600 64px Cinzel, serif; color: var(--gold); text-shadow: 0 0 24px rgba(246,200,110,.5); }
.vorne { background: #111 center 18% / cover; box-shadow: 0 0 0 2px var(--rand, #6e4e1c), 0 0 0 6px rgba(0,0,0,.55), 0 0 0 7px rgba(217,178,106,.3), 0 24px 50px rgba(0,0,0,.6); transition: box-shadow .3s; }
.vorne::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(7,8,11,.55) 58%, rgba(7,8,11,.96) 82%); }
.vorne .klasse { position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 4px 9px; border-radius: 8px; color: #fff; background: var(--kf, #555); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.vorne .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 16px 16px 18px; text-align: center; }
.vorne h3 { font: 600 26px Cinzel, serif; color: #fff; text-shadow: 0 2px 10px #000; }
.vorne .titel { font: italic 17px "Cormorant Garamond", serif; color: var(--gold-hell); }
.vorne .rolle { margin-top: 8px; font-size: 12px; color: #d8cfbd; }
.vorne .lupe { display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: .12em; color: var(--gold); opacity: .85; }
.karte.gewaehlt .vorne { box-shadow: 0 0 0 3px var(--gold-hell), 0 0 50px rgba(246,200,110,.7), 0 30px 60px rgba(0,0,0,.6); }
.karte.weg { transition: transform .8s cubic-bezier(.5,0,.75,0), opacity .8s; opacity: 0; transform: translateY(40px) scale(.7); pointer-events: none; }
.karte.einbuchen { z-index: 30; transition: transform .9s cubic-bezier(.5,0,.2,1), opacity .9s; }
.enden-liste { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0 6px; }
.ende-chip { position: relative; overflow: hidden; padding: 14px 14px 18px; border-radius: 14px; background: linear-gradient(180deg, rgba(7,8,11,.55), rgba(7,8,11,.9)), var(--bild) center / cover; box-shadow: 0 0 0 1px rgba(217,178,106,.3); }
.ende-chip b { display: block; font: 600 14px Cinzel, serif; color: #fff; } .ende-chip span { font-size: 12px; color: var(--gold-hell); }
.ende-chip i { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #b8742a, #ffd27a); }
@media (max-width: 900px) { .enden-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.drin-marke { position: absolute; top: 12px; right: 12px; z-index: 1; font-size: 10px; font-weight: 600; letter-spacing: .1em; padding: 4px 9px; border-radius: 8px; color: #241505; background: linear-gradient(180deg, #fff0c4, #e0b260); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.btn.weiter { min-width: 240px; font-size: 18px; padding: 16px 40px; }
.hub-raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 900px; margin: 24px auto 0; }
.hub-kachel { position: relative; min-height: 190px; padding: 18px; border: 0; border-radius: 18px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  background: linear-gradient(180deg, rgba(7,8,11,.05), rgba(7,8,11,.88) 75%), var(--bild) center / cover; box-shadow: 0 0 0 1px rgba(217,178,106,.4), 0 14px 30px rgba(0,0,0,.5); transition: transform .2s, box-shadow .2s; }
.hub-kachel:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--gold-hell), 0 0 26px rgba(246,200,110,.3), 0 14px 30px rgba(0,0,0,.5); }
.hub-kachel:disabled { opacity: .5; cursor: default; }
.hub-kachel b { font: 600 22px Cinzel, serif; color: #fff; } .hub-kachel small { font-size: 13px; color: var(--gold-hell); margin-top: 4px; }
.hub-kachel .neu { position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 600; letter-spacing: .14em; padding: 3px 8px; border-radius: 8px; color: #241505; background: linear-gradient(180deg, #fff0c4, #e0b260); }
.hub-helden { display: flex; gap: 6px; margin-top: 10px; } .hub-helden i { width: 38px; height: 38px; border-radius: 10px; background: #111 center 18% / cover; box-shadow: 0 0 0 2px var(--gold-dunkel); }
@media (max-width: 620px) { .hub-raster { grid-template-columns: 1fr; } .hub-kachel { min-height: 150px; } }
@media (max-width: 620px) {
  .buehne.drei { flex-wrap: nowrap; gap: 8px; margin-top: 22px; } .buehne.drei .karte { width: 31vw; }
  .buehne.drei .vorne h3 { font-size: 15px; } .buehne.drei .vorne .titel { font-size: 12px; } .buehne.drei .vorne .rolle, .buehne.drei .vorne .lupe { display: none; }
  .buehne.drei .vorne .klasse { font-size: 8px; padding: 3px 6px; top: 8px; left: 8px; } .buehne.drei .drin-marke { top: auto; bottom: 64px; right: 50%; transform: translateX(50%); font-size: 9px; white-space: nowrap; }
  .buehne.drei .vorne .info { padding: 10px 8px 12px; }
}
.siegel { width: min(320px, 80vw); margin: 26px auto 0; padding: 26px 22px; border-radius: 22px; text-align: center; background: radial-gradient(circle at 50% 30%, rgba(246,220,156,.18), transparent 60%), linear-gradient(160deg, #2a2117, #0d0c0b); box-shadow: 0 0 0 2px #d9b26a, 0 0 0 7px rgba(0,0,0,.6), 0 0 50px rgba(246,200,110,.35); animation: siegel-auf .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes siegel-auf { from { opacity: 0; transform: rotateY(90deg) scale(.8); } }
.siegel .zeichen { font: 600 54px Cinzel, serif; color: var(--gold-hell); text-shadow: 0 0 24px rgba(246,200,110,.6); }
.siegel b { display: block; font: 600 20px Cinzel, serif; color: #fff; margin-top: 6px; } .siegel small { display: block; margin-top: 6px; color: var(--gold-hell); font-size: 13px; }
.hinweis { text-align: center; color: var(--leise); font-size: 13px; margin-top: 18px; }

/* Detail zum Begutachten */
.schleier { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.schleier.an { opacity: 1; pointer-events: auto; }
.detail { width: min(940px, 100%); max-height: calc(100vh - 40px); overflow: auto; display: grid; grid-template-columns: 320px 1fr; border-radius: 22px;
  background: linear-gradient(160deg, rgba(34,30,26,.98), rgba(12,11,10,.98)); box-shadow: 0 0 0 1px rgba(217,178,106,.45), 0 40px 90px rgba(0,0,0,.7); transform: scale(.94) translateY(10px); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.schleier.an .detail { transform: none; }
.detail .bild { position: sticky; top: 0; align-self: start; height: min(460px, calc(100vh - 40px)); background: #111 center 18% / cover; border-radius: 22px 0 22px 0; }
.detail .bild::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent 70%, rgba(12,11,10,.95)); }
.detail .rechts { padding: 26px 28px 24px; }
.detail h2 { font: 600 34px Cinzel, serif; color: #fff; }
.detail .titel { font: italic 20px "Cormorant Garamond", serif; color: var(--gold-hell); }
.detail .spruch { margin: 10px 0 14px; font: italic 18px "Cormorant Garamond", serif; color: var(--leise); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chips span { padding: 6px 10px; border-radius: 10px; font-size: 12px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(217,178,106,.28); }
.chips b { font: 600 15px Cinzel, serif; color: var(--gold-hell); margin-left: 4px; }
.attr { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; }
.attr div { text-align: center; padding: 8px 2px; border-radius: 10px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.attr small { display: block; font-size: 10px; letter-spacing: .12em; color: var(--leise); }
.attr b { font: 600 20px Cinzel, serif; color: #fff; }
.attr i { display: block; font-style: normal; font-size: 11px; color: var(--gold); }
.detail h4 { font: 600 12px Cinzel, serif; letter-spacing: .25em; color: var(--gold); margin: 14px 0 8px; text-transform: uppercase; }
.faehig { display: grid; gap: 8px; }
.faehig div { padding: 9px 11px; border-radius: 12px; background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(217,178,106,.14); }
.faehig b { font-size: 14px; color: #fff; } .faehig em { font-style: normal; font-size: 10px; letter-spacing: .1em; color: var(--gold); margin-left: 6px; text-transform: uppercase; }
.faehig p { font-size: 12.5px; color: #cfc6b4; margin-top: 3px; line-height: 1.4; }
.knoepfe { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.detail .knoepfe { position: sticky; bottom: -24px; margin: 20px -28px -24px; padding: 16px 28px 20px; background: linear-gradient(180deg, rgba(14,13,12,0), #0e0d0c 30%); }
.btn { border: 0; padding: 14px 26px; border-radius: 14px; font: 600 16px Cinzel, serif; letter-spacing: .06em; }
.btn.gold { color: #241505; background: linear-gradient(180deg, #fff0c4, #e0b260 50%, #b07c2c); box-shadow: 0 0 0 1px #6e4e1c, 0 0 24px rgba(246,200,110,.4), inset 0 1px 0 rgba(255,255,255,.6); }
.btn.gold:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
.btn.leise { color: var(--text); background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(217,178,106,.3); font-family: Inter, sans-serif; font-size: 14px; }
.gesperrt-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); font-size: 13.5px; color: #d8cfbd; display: flex; gap: 10px; align-items: flex-start; }
.gesperrt-box svg { flex: none; width: 20px; height: 20px; }

/* Sammlung und Heldenwahl */
.klassen-reihe { margin-top: 28px; }
.klassen-reihe h3 { display: flex; align-items: center; gap: 10px; font: 600 14px Cinzel, serif; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
.klassen-reihe h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--kf); box-shadow: 0 0 10px var(--kf); }
.raster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mini { position: relative; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; border: 0; text-align: left; color: var(--text);
  background: linear-gradient(135deg, rgba(34,36,48,.92), rgba(14,15,20,.92)); box-shadow: 0 0 0 1px rgba(217,178,106,.3), 0 12px 26px rgba(0,0,0,.45); transition: transform .2s, box-shadow .2s; }
.mini:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(246,220,156,.7), 0 0 24px rgba(246,200,110,.2), 0 12px 26px rgba(0,0,0,.45); }
.mini .pb { width: 96px; height: 116px; border-radius: 12px; background: #111 center 18% / cover; box-shadow: 0 0 0 2px var(--kf, #6e4e1c); }
.mini b { display: block; font: 600 20px Cinzel, serif; color: #fff; }
.mini .t { font: italic 16px "Cormorant Garamond", serif; color: var(--gold-hell); }
.mini small { display: block; margin-top: 6px; font-size: 12px; color: var(--leise); }
.mini .neu { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 600; letter-spacing: .14em; padding: 3px 8px; border-radius: 8px; color: #241505; background: linear-gradient(180deg, #fff0c4, #e0b260); }
.mini.zu { background: linear-gradient(135deg, rgba(30,30,32,.92), rgba(16,16,18,.92)); box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.mini.zu .pb { filter: grayscale(1) brightness(.35); box-shadow: 0 0 0 2px #333; }
.mini.zu b, .mini.zu .t { color: #7d776c; }
.mini .schloss { position: absolute; left: 12px; top: 12px; width: 96px; height: 116px; display: grid; place-items: center; }
.mini .schloss svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 6px #000); }
.mini .wie { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 12px; color: #9a9384; }
.mini.zu.wackeln { animation: wackeln .4s; }
@keyframes wackeln { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.mini.drin { box-shadow: 0 0 0 3px var(--gold-hell), 0 0 30px rgba(246,200,110,.45), 0 12px 26px rgba(0,0,0,.45); }
.mini .haken { position: absolute; right: 12px; bottom: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #241505; background: linear-gradient(180deg, #fff0c4, #e0b260); }
.leiste-wahl { position: sticky; bottom: 0; margin-top: 26px; padding: 16px 0 20px; display: flex; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(180deg, transparent, #07080b 40%); }
.leiste-wahl .platz { display: flex; gap: 8px; }
.leiste-wahl .platz i { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.05) center 18% / cover; box-shadow: inset 0 0 0 1px rgba(217,178,106,.3); }
.leiste-wahl .platz i.voll { box-shadow: 0 0 0 2px var(--gold-hell); }
.hinweis-box { max-width: 760px; margin: 18px auto 0; padding: 12px 16px; border-radius: 14px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(217,178,106,.2); font-size: 13.5px; color: #d8cfbd; text-align: center; }

/* Nach der Kampagne */
.sieg { position: relative; margin: -28px -20px 0; padding: 70px 20px 40px; overflow: hidden; min-height: 70vh; }
.sieg .hg { position: absolute; inset: 0; background: var(--bild) center 40% / cover; opacity: .32; filter: saturate(.9); }
.sieg .hg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 40%, transparent, rgba(7,8,11,.95)), linear-gradient(180deg, transparent 50%, #07080b); }
.sieg > *:not(.hg) { position: relative; }
.steuer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 0 auto 18px; padding: 10px 14px; max-width: 920px; border-radius: 14px; background: rgba(0,0,0,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); font-size: 13px; color: var(--leise); }
.steuer select, .steuer label { font: inherit; color: var(--text); }
.steuer select { background: #15161c; border: 1px solid rgba(217,178,106,.3); border-radius: 8px; padding: 6px 8px; }
.ende-karte { max-width: 560px; margin: 30px auto 0; padding: 26px; border-radius: 20px; text-align: center; background: rgba(12,11,10,.85); box-shadow: 0 0 0 1px rgba(217,178,106,.4); }
.flieg { position: fixed; z-index: 60; border-radius: 14px; background: #111 center 18% / cover; box-shadow: 0 0 0 2px var(--gold-hell), 0 0 40px rgba(246,200,110,.7); pointer-events: none; transition: all .9s cubic-bezier(.5,0,.2,1); }
.zaehler.puls b { animation: puls .8s; }
@keyframes puls { 40% { transform: scale(1.5); color: #fff; text-shadow: 0 0 18px var(--gold-hell); } }

@media (max-width: 900px) {
  .detail .bild { position: relative; height: 300px; }
  .raster { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .detail { grid-template-columns: 1fr; } .detail .bild { min-height: 260px; border-radius: 22px 22px 0 0; } .detail .bild::after { background: linear-gradient(180deg, transparent 60%, rgba(12,11,10,.95)); }
}
@media (max-width: 620px) {
  .raster { grid-template-columns: 1fr; }
  .buehne { gap: 12px; } .karte { width: min(78vw, 300px); }
  .attr { grid-template-columns: repeat(3, 1fr); }
  .kopf { position: relative; gap: 8px; padding: 10px 14px; } .proto { display: none; } .zaehler { margin-left: auto; }
  .ansichten { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .ansichten button { white-space: nowrap; }
  main { padding-top: 20px; } .karte { width: min(72vw, 270px); }
  .leiste-wahl { flex-direction: column; gap: 10px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); margin-left: -20px; margin-right: -20px; background: linear-gradient(180deg, rgba(7,8,11,0), #07080b 25%); }
  .leiste-wahl .platz { gap: 6px; } .leiste-wahl .platz i { width: 40px; height: 40px; border-radius: 10px; }
  .leiste-wahl .btn { width: calc(100% - 40px); }
  .mini { grid-template-columns: 76px 1fr; } .mini .pb, .mini .schloss { width: 76px; height: 92px; } .mini b { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .karte .innen, .karte, .flieg { transition: none !important; } }
</style>
</head>
<body>
<header class="kopf">
  <span class="logo">MYTHARA</span><span class="proto">Prototyp · Heldenfreischaltung</span>
  <nav class="ansichten" id="ansichten">
    <button data-a="registrierung" class="an">1 · Registrierung</button>
    <button data-a="start">2 · Startseite</button>
    <button data-a="sammlung">3 · Charaktere</button>
    <button data-a="wahl">4 · Heldenwahl im Spiel</button>
    <button data-a="belohnung">5 · Nach der Kampagne</button>
  </nav>
  <div class="zaehler" id="zaehler"><svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="ring" cx="20" cy="20" r="16" fill="none" stroke="#f6dc9c" stroke-width="4" stroke-linecap="round" transform="rotate(-90 20 20)"/></svg><span><b id="anzahl">0</b> von 15 Helden</span><button class="link" id="zuruecksetzen">Zurücksetzen</button></div>
</header>
<main>
  <section class="ansicht" id="registrierung"></section>
  <section class="ansicht" id="start" hidden></section>
  <section class="ansicht" id="sammlung" hidden></section>
  <section class="ansicht" id="wahl" hidden></section>
  <section class="ansicht" id="belohnung" hidden></section>
</main>
<div class="schleier" id="schleier"><div class="detail" id="detail"></div></div>

<script src="../js/figuren.js"></script>
<script>
(function () {
  "use strict";
  const F = window.ABF, $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const bild = (fid) => "../" + F.bild(fid);
  const KEY = "proto_heldensammlung";
  const SCHLOSS = '<svg viewBox="0 0 24 24" fill="none" stroke="#e8dcc0" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="rgba(0,0,0,.55)"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.4" fill="#e8dcc0"/></svg>';

  /* Kampagnen und ihre regulären Enden (aus den Abenteuerdaten). Jedes Ende schaltet beim ersten Erreichen einen Helden frei. */
  const KAMPAGNEN = {
    rabenmoor: { titel: "Das Moor der stummen Lichter", bild: "../img/rabenmoor/titel.webp", enden: { ende_erloest: "Der Name im Wasser", ende_besiegt: "Stille über dem Moor" } },
    grauwacht: { titel: "Das Siegel von Grauwacht", bild: "../img/grauwacht/titel.webp", enden: { ende_waechter: "Der letzte Winter", ende_kobold: "Der Hüter mit den vielen Zähnen", ende_opfer: "Der neue Hüter", ende_bruch: "Der Einsturz", ende_verrat: "Der Hüter wider Willen" } },
    hochwacht: { titel: "Die letzte Fackel von Hochwacht", bild: "../img/hochwacht/titel.webp", enden: { ende_fackel: "Die Fackel bewahrt", ende_funke: "Der Funke im Gepäck", ende_dunkel: "Die Nordwarte verstummt" } },
    krone: { titel: "Die Krone unter dem Eis", bild: "../img/krone/titel.webp", enden: { ende_stabil: "Das Herz schlägt ruhig", ende_versiegelt: "Die Stadt schläft", ende_umgeleitet: "Ein Siegel entlastet, ein anderes bebt" } },
  };
  const ALLE_ENDEN = Object.entries(KAMPAGNEN).flatMap(([k, v]) => Object.keys(v.enden).map((e) => k + ":" + e));

  /* ---------- Zustand ---------- */
  let S = laden();
  let sperre = false; // während Einbuchen-Animation keine weiteren Eingaben
  function laden() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.sammlung)) { s.enden = s.enden || []; return s; } } catch (e) { /* neu */ } return { sammlung: [], neu: [], runde: 0, angebote: null, gesehen: [], enden: [] }; }
  function speichern() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* privat */ } zaehler(); }
  function zaehler(puls) {
    const n = S.sammlung.length; $("#anzahl").textContent = n;
    const u = 2 * Math.PI * 16; $("#ring").setAttribute("stroke-dasharray", `${(u * n / 15).toFixed(1)} ${u.toFixed(1)}`);
    if (puls) { const z = $("#zaehler"); z.classList.remove("puls"); void z.offsetWidth; z.classList.add("puls"); }
  }
  const zufall = (a) => a[Math.floor(Math.random() * a.length)];
  const mischen = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  /** Drei Angebote aus dem Pool, möglichst aus drei Klassen, ohne bereits Angebotenes */
  function ziehen(pool, n = 3) {
    const nachKlasse = {}; for (const f of mischen(pool)) (nachKlasse[F.FIGUREN[f].klasse] = nachKlasse[F.FIGUREN[f].klasse] || []).push(f);
    const out = []; for (const k of mischen(Object.keys(nachKlasse))) { if (out.length >= n) break; out.push(nachKlasse[k][0]); }
    for (const f of mischen(pool)) { if (out.length >= n) break; if (!out.includes(f)) out.push(f); }
    return out;
  }

  /* ---------- Karten ---------- */
  function karte(fid, extra = "") {
    const d = F.FIGUREN[fid], k = F.KLASSEN[d.klasse];
    return `<div class="karte verdeckt ${extra}" data-fid="${fid}" role="button" tabindex="0" aria-label="${esc(d.name)} ansehen"><div class="innen">
      <div class="vorne" style="background-image:url('${bild(fid)}');--rand:${k.farbe};--kf:${k.farbe}"><span class="klasse">${esc(k.name)}</span>${extra.includes("eingebucht") ? '<span class="drin-marke">✓ Eingebucht</span>' : ""}
        <div class="info"><h3>${esc(d.name)}</h3><div class="titel">${esc(d.titel)}</div><div class="rolle">${esc(d.rolle)}</div><span class="lupe">ANSEHEN ›</span></div></div>
      <div class="hinten"><span>M</span></div></div></div>`;
  }
  function aufdecken(el) { el.querySelectorAll(".karte.verdeckt").forEach((k, i) => setTimeout(() => k.classList.remove("verdeckt"), 350 + i * 320)); }

  /* ---------- Detail zum Begutachten ---------- */
  const ATTR = ["STR", "GES", "KON", "INT", "WEI", "CHA"], TYP = { aktion: "Aktion", bonus: "Bonus", passiv: "Passiv", frei: "Frei", reaktion: "Reaktion" };
  function detail(fid, opt = {}) {
    if (sperre) return;
    const d = F.FIGUREN[fid], k = F.KLASSEN[d.klasse], zu = !S.sammlung.includes(fid) && !opt.einbuchen;
    const f1 = F.faehigVon(fid, 1);
    $("#detail").innerHTML = `<div class="bild" style="background-image:url('${bild(fid)}')${zu ? ";filter:grayscale(1) brightness(.5)" : ""}"></div>
      <div class="rechts"><span class="eyebrow" style="text-align:left;display:block;color:${k.farbe}">${esc(k.name)}</span><h2>${esc(d.name)}</h2><div class="titel">${esc(d.titel)}</div>
        <p class="spruch">„${esc(d.spruch)}“</p>
        <div class="chips"><span>Lebenspunkte<b>${F.tpVon(fid, 1)}</b></span><span>Rüstung<b>${d.rk[0]}</b></span><span>Bewegung<b>${k.bewegung || 6}</b></span><span>Rolle<b style="font:600 13px Inter">${esc(d.rolle)}</b></span></div>
        <div class="attr">${ATTR.map((a) => `<div><small>${a}</small><b>${d.werte[a]}</b><i>${F.mod(d.werte[a]) >= 0 ? "+" : ""}${F.mod(d.werte[a])}</i></div>`).join("")}</div>
        <h4>Klassenmerkmal</h4><div class="faehig"><div><b>${esc(k.merkmal.split(":")[0])}</b><p>${esc(k.merkmal.split(":").slice(1).join(":").trim())}</p></div></div>
        <h4>Fähigkeiten zu Beginn</h4><div class="faehig">${f1.map((a) => `<div><b>${esc(a.name)}</b><em>${TYP[a.typ] || ""}</em><p>${esc(a.text || "")}</p></div>`).join("")}</div>
        <h4>Außerhalb des Kampfes</h4><div class="faehig"><div><b>${esc(d.aussen.name)}</b><p>${esc(d.aussen.text)}</p></div></div>
        ${zu ? `<div class="gesperrt-box">${SCHLOSS}<span><b>Noch gesperrt.</b> Jedes Kampagnen-Ende, das ihr zum ersten Mal erreicht, schaltet einen Helden frei: Ihr wählt aus drei Angeboten.</span></div>` : ""}
        <div class="knoepfe"><button class="btn leise" id="d-zu">${opt.einbuchen ? "Zurück zur Auswahl" : "Schließen"}</button>${opt.einbuchen ? `<button class="btn gold" id="d-ein">${esc(d.name)} einbuchen</button>` : ""}</div></div>`;
    $("#schleier").classList.add("an");
    $("#d-zu").onclick = schliessen;
    if (opt.einbuchen) $("#d-ein").onclick = () => { if (sperre) return; sperre = true; schliessen(); opt.einbuchen(); };
  }
  function schliessen() { $("#schleier").classList.remove("an"); }
  $("#schleier").onclick = (e) => { if (e.target.id === "schleier") schliessen(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") schliessen(); });

  /** Karte fliegt in den Zähler oben rechts */
  function einfliegen(el, fid, fertig) {
    const r = el.getBoundingClientRect(), z = $("#zaehler").getBoundingClientRect();
    const f = document.createElement("div"); f.className = "flieg"; f.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background-image:url('${bild(fid)}')`;
    document.body.appendChild(f); el.style.visibility = "hidden";
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = z.left + "px"; f.style.top = z.top + "px"; f.style.width = "40px"; f.style.height = "40px"; f.style.opacity = ".2"; }));
    setTimeout(() => { f.remove(); zaehler(true); sperre = false; fertig && fertig(); }, 950);
  }
  function aufnehmen(fid) { if (!S.sammlung.includes(fid)) { S.sammlung.push(fid); S.neu.push(fid); } speichern(); }

  /* ---------- 1 · Registrierung: drei Runden ---------- */
  function registrierung() {
    const el = $("#registrierung");
    if (S.runde >= 3 || S.sammlung.length >= 3) {
      el.innerHTML = `<p class="eyebrow">Registrierung abgeschlossen</p><h1 class="gross">Deine Helden sind eingebucht</h1>
        <div class="runden">${[0, 1, 2].map(() => '<i class="fertig"></i>').join("")}</div>
        <div class="buehne drei">${S.sammlung.slice(0, 3).map((f) => karte(f, "eingebucht")).join("")}</div>
        <p class="unter">Ab sofort stehen sie dir unter <b style="color:var(--gold-hell);font-style:normal">Charaktere</b> zur Verfügung. Jedes Kampagnen-Ende, das du zum ersten Mal erreichst, bringt einen neuen Helden dazu.</p>
        <div class="knoepfe" style="justify-content:center;margin-top:22px"><button class="btn gold weiter" data-geh="start">Weiter</button></div>`;
      aufdecken(el); binden(el); return;
    }
    if (!S.angebote) {
      const schon = new Set([...S.sammlung, ...S.gesehen]);
      S.angebote = ziehen(F.REIHE.filter((f) => !schon.has(f))); S.gesehen.push(...S.angebote); speichern();
    }
    el.innerHTML = `<p class="eyebrow">Registrierung · Runde ${S.runde + 1} von 3</p><h1 class="gross">Wähle deinen ${["ersten", "zweiten", "dritten"][S.runde]} Helden</h1>
      <p class="unter">Drei Helden bieten dir ihre Klinge an. Tippe eine Karte an, um sie dir genau anzusehen, und buche den ein, mit dem du losziehen willst.</p>
      <div class="runden">${[0, 1, 2].map((i) => `<i class="${i < S.runde ? "fertig" : i === S.runde ? "jetzt" : ""}"></i>`).join("")}</div>
      <div class="buehne" id="reg-buehne">${S.angebote.map((f) => karte(f)).join("")}</div>
      <p class="hinweis">Die Wahl ist endgültig. Die beiden anderen bleiben im Pool und können später wieder auftauchen.</p>`;
    aufdecken(el);
    el.querySelectorAll(".karte").forEach((k) => { const f = k.dataset.fid; k.onclick = () => !k.classList.contains("verdeckt") && detail(f, { einbuchen: () => regEinbuchen(k, f) }); });
  }
  function regEinbuchen(k, fid) {
    const runde = S.runde;
    if (runde >= 3 || S.sammlung.length >= 3 || !(S.angebote || []).includes(fid)) { sperre = false; return; }
    const andere = [...document.querySelectorAll("#reg-buehne .karte")].filter((x) => x !== k);
    andere.forEach((x) => x.classList.add("weg")); k.classList.add("gewaehlt");
    setTimeout(() => einfliegen(k, fid, () => { if (S.runde === runde) { aufnehmen(fid); S.runde = runde + 1; S.angebote = null; speichern(); } registrierung(); }), 650);
  }

  /* ---------- 2 · Startseite nach der Anmeldung (nachgebaut wie der Hub) ---------- */
  function start() {
    const el = $("#start"), meine = S.sammlung.slice(-4);
    el.innerHTML = `<div class="hub"><p class="eyebrow">Willkommen in Mythara</p><h1 class="gross">Schön, dass du da bist</h1><p class="unter">Deine Reise beginnt hier. Wähle, wie es weitergeht.</p><div class="zier"></div>
      <div class="hub-raster">
        <button class="hub-kachel" data-geh="wahl" style="--bild:url('../img/mythara/karte-neu.webp')"><b>Neue Kampagne</b><small>Gruppe wählen und losziehen</small></button>
        <button class="hub-kachel" data-geh="belohnung" style="--bild:url('../img/mythara/karte-kampagnen.webp')"><b>Meine Kampagnen</b><small>Im Prototyp: Belohnung nach einem Kampagnen-Ende</small></button>
        <button class="hub-kachel gross-kachel" data-geh="sammlung" style="--bild:url('../img/mythara/karte-helden.webp')"><b>Charaktere</b><small>${S.sammlung.length} von 15 Helden freigeschaltet</small>
          <span class="hub-helden">${meine.map((f) => `<i style="background-image:url('${bild(f)}')"></i>`).join("")}</span>${S.neu.length ? '<span class="neu">NEU</span>' : ""}</button>
        <button class="hub-kachel" disabled style="--bild:url('../img/mythara/karte-beitreten.webp')"><b>Kampagnenwelt</b><small>im Prototyp nicht enthalten</small></button>
      </div></div>`;
    binden(el);
  }

  /* ---------- 3 · Charaktere ---------- */
  function miniHtml(fid, modus) {
    const d = F.FIGUREN[fid], k = F.KLASSEN[d.klasse], hat = S.sammlung.includes(fid);
    const wie = hat ? `<small>${esc(d.rolle)}</small>` : `<span class="wie">Gesperrt · Belohnung für ein neues Kampagnen-Ende</span>`;
    return `<button class="mini ${hat ? "" : "zu"} ${modus === "wahl" && WAHL.includes(fid) ? "drin" : ""}" data-mini="${fid}" style="--kf:${k.farbe}">
      <span class="pb" style="background-image:url('${bild(fid)}')"></span>${hat ? "" : `<span class="schloss">${SCHLOSS}</span>`}
      <span><b>${esc(d.name)}</b><span class="t">${esc(d.titel)}</span>${wie}</span>
      ${hat && S.neu.includes(fid) && modus !== "wahl" ? '<span class="neu">NEU</span>' : ""}${modus === "wahl" && WAHL.includes(fid) ? `<span class="haken">${WAHL.indexOf(fid) + 1}</span>` : ""}</button>`;
  }
  function nachKlassen(modus) {
    return Object.keys(F.KLASSEN).map((kl) => `<div class="klassen-reihe"><h3 style="--kf:${F.KLASSEN[kl].farbe}"><i></i>${esc(F.KLASSEN[kl].name)}</h3>
      <div class="raster">${F.REIHE.filter((f) => F.FIGUREN[f].klasse === kl).map((f) => miniHtml(f, modus)).join("")}</div></div>`).join("");
  }
  function sammlung() {
    const el = $("#sammlung");
    const offen = ALLE_ENDEN.length - S.enden.length;
    el.innerHTML = `<p class="eyebrow">Hub</p><h1 class="gross">Charaktere</h1><p class="unter">${S.sammlung.length} von 15 freigeschaltet. Jedes Kampagnen-Ende, das ihr zum ersten Mal erreicht, bringt einen neuen Helden. Noch ${offen} von ${ALLE_ENDEN.length} Enden zu entdecken.</p><div class="zier"></div>
      <div class="enden-liste">${Object.entries(KAMPAGNEN).map(([k, v]) => { const n = Object.keys(v.enden).length, g = Object.keys(v.enden).filter((e) => S.enden.includes(k + ":" + e)).length; return `<div class="ende-chip" style="--bild:url('${v.bild}')"><b>${esc(v.titel)}</b><span>${g} von ${n} Enden</span><i style="width:${(g / n) * 100}%"></i></div>`; }).join("")}</div>${nachKlassen("sammlung")}`;
    el.querySelectorAll("[data-mini]").forEach((b) => { b.onclick = () => detail(b.dataset.mini); });
    S.neu = []; speichern();
  }

  /* ---------- 3 · Heldenwahl im Spiel ---------- */
  let WAHL = [];
  function wahl() {
    WAHL = WAHL.filter((f) => S.sammlung.includes(f));
    const el = $("#wahl");
    el.innerHTML = `<p class="eyebrow">Spieltisch · Neue Kampagne</p><h1 class="gross">Wählt eure Gruppe</h1><p class="unter">3 bis 6 Helden. Ihr wählt aus euren freigeschalteten Helden. Gesperrte sind grau und lassen sich nicht wählen.</p>
      ${S.sammlung.length < 3 ? `<div class="hinweis-box">Du hast erst ${S.sammlung.length} Helden. Im echten Spiel ergänzt der Tisch dann aus einem festen Starter-Set (siehe Konzept B2 und B4). Spiele zuerst die Registrierung durch.</div>` : ""}
      ${nachKlassen("wahl")}
      <div class="leiste-wahl"><div class="platz">${Array.from({ length: 6 }, (_, i) => `<i class="${WAHL[i] ? "voll" : ""}" style="${WAHL[i] ? `background-image:url('${bild(WAHL[i])}')` : ""}"></i>`).join("")}</div>
        <button class="btn gold" id="los" ${WAHL.length >= 3 ? "" : "disabled"}>Abenteuer beginnen (${WAHL.length})</button></div>`;
    el.querySelectorAll("[data-mini]").forEach((b) => {
      b.onclick = () => {
        const f = b.dataset.mini;
        if (!S.sammlung.includes(f)) { b.classList.remove("wackeln"); void b.offsetWidth; b.classList.add("wackeln"); return detail(f); }
        WAHL = WAHL.includes(f) ? WAHL.filter((x) => x !== f) : WAHL.length < 6 ? WAHL.concat(f) : WAHL; wahl();
      };
    });
    $("#los").onclick = () => { geh("belohnung"); };
  }

  /* ---------- 4 · Nach der Kampagne ---------- */
  let B = { kampagne: "rabenmoor", ende: "ende_erloest", schritt: 0, angebote: null };
  function belohnung() {
    const el = $("#belohnung"), K = KAMPAGNEN[B.kampagne];
    if (!K.enden[B.ende]) B.ende = Object.keys(K.enden)[0];
    const schluessel = B.kampagne + ":" + B.ende, neuesEnde = !S.enden.includes(schluessel) || B.schritt > 0;
    const steuer = `<div class="steuer">Prototyp-Steuerung: Kampagne <select id="b-kamp">${Object.entries(KAMPAGNEN).map(([k, v]) => `<option value="${k}" ${k === B.kampagne ? "selected" : ""}>${esc(v.titel)}</option>`).join("")}</select>
      erreichtes Ende <select id="b-ende">${Object.entries(K.enden).map(([e, t]) => `<option value="${e}" ${e === B.ende ? "selected" : ""}>${esc(t)}${S.enden.includes(B.kampagne + ":" + e) ? " (schon erreicht)" : ""}</option>`).join("")}</select>
      <button class="btn leise" id="b-neu" style="padding:6px 12px">Neu starten</button><button class="btn leise" id="b-voll" style="padding:6px 12px">Test: alle 15 Helden freischalten</button></div>`;
    let inhalt = "";
    if (B.schritt === 0) {
      inhalt = `<p class="eyebrow">Kampagne gewonnen · Ende: ${esc(K.enden[B.ende])}</p><h1 class="gross">Sieg</h1><p class="unter">${esc(K.titel)}.</p><div class="zier"></div>
        ${neuesEnde ? `<div class="hinweis-box"><b>Neues Ende entdeckt.</b> Zum ersten Mal habt ihr „${esc(K.enden[B.ende])}“ erreicht. ${S.sammlung.length >= 15 ? "Eure Sammlung ist schon vollständig. Dafür bekommt ihr einen Eintrag in eurer Chronik." : "Dafür schließt sich euch ein neuer Held an."}</div>
          <div class="knoepfe" style="justify-content:center"><button class="btn gold" id="b-weiter">${S.sammlung.length >= 15 ? "Chronik ansehen" : "Belohnung ansehen"}</button></div>`
        : `<div class="hinweis-box">Dieses Ende habt ihr schon einmal erreicht. Einen neuen Helden gibt es nur für ein Ende, das ihr zum ersten Mal erreicht. ${(() => { const n = Object.keys(K.enden).filter((e) => !S.enden.includes(B.kampagne + ":" + e)).length; return n === 0 ? `Alle Enden von „${esc(K.titel)}“ habt ihr schon entdeckt.` : `In „${esc(K.titel)}“ wartet noch ${n === 1 ? "ein weiteres Ende" : n + " weitere Enden"}.`; })()}</div>`}`;
    } else if (B.schritt === 2) {
      const pool = F.REIHE.filter((f) => !S.sammlung.includes(f));
      if (!pool.length) {
        const n = Object.keys(K.enden).length, g = Object.keys(K.enden).filter((e) => S.enden.includes(B.kampagne + ":" + e)).length, alle = g === n;
        const TITEL = { rabenmoor: "Kenner des Schwarzmoors", grauwacht: "Hüter von Grauwacht", hochwacht: "Fackelträger des Nordens", krone: "Bezwinger der Eiskrone" };
        inhalt = `<p class="eyebrow">Sammlung vollständig · alle 15 Helden</p><h1 class="gross">Ein Eintrag in eurer Chronik</h1>
          <div class="siegel"><div class="zeichen">✦</div><b>${esc(K.enden[B.ende])}</b><small>${esc(K.titel)} · Ende ${g} von ${n}</small></div>
          <p class="unter" style="margin-top:18px">${alle ? `Ihr habt alle Enden dieser Kampagne gefunden. Dafür tragt ihr ab sofort den Titel <b style="color:var(--gold-hell);font-style:normal">„${TITEL[B.kampagne]}“</b>, er erscheint neben eurem Namen.` : `Jedes neue Ende wird als Siegel in der Chronik festgehalten. Wer alle ${n} Enden dieser Kampagne findet, bekommt den Titel „${TITEL[B.kampagne]}“.`}</p>
          <div class="knoepfe" style="justify-content:center"><button class="btn leise" data-geh="start">Zur Startseite</button></div>`;
      }
      else {
        if (!B.angebote) B.angebote = ziehen(pool, Math.min(3, pool.length));
        inhalt = `<p class="eyebrow">Belohnung · neues Ende</p><h1 class="gross">Wähle einen neuen Helden</h1><p class="unter">Einer von dreien schließt sich dir dauerhaft an. Sieh sie dir an und entscheide dich.</p>
          <div class="buehne" id="b-buehne">${B.angebote.map((f) => karte(f)).join("")}</div><p class="hinweis">Gewählt wird auf dem eigenen Handy. Der Spieltisch zeigt nur, dass eine Belohnung bereitsteht.</p>`;
      }
    } else {
      const neu = S.sammlung.slice(-1);
      inhalt = `<p class="eyebrow">Neu in deiner Sammlung</p><h1 class="gross">${neu.map((f) => esc(F.FIGUREN[f].name)).join("")}</h1><div class="buehne">${neu.map((f) => karte(f)).join("")}</div>
        <p class="unter">${S.sammlung.length} von 15 Helden · ${S.enden.length} von ${ALLE_ENDEN.length} Enden entdeckt. In der nächsten Kampagne steht ${neu.map((f) => esc(F.FIGUREN[f].name)).join("")} zur Wahl.</p>
        <div class="knoepfe" style="justify-content:center"><button class="btn leise" data-geh="sammlung">Charaktere</button><button class="btn gold" data-geh="wahl">Zur Heldenwahl</button></div>`;
    }
    el.innerHTML = `<div class="sieg"><div class="hg" style="--bild:url('${K.bild}')"></div>${steuer}${inhalt}</div>`;
    $("#b-kamp").onchange = (e) => { B = { kampagne: e.target.value, ende: Object.keys(KAMPAGNEN[e.target.value].enden)[0], schritt: 0, angebote: null }; belohnung(); };
    $("#b-ende").onchange = (e) => { B.ende = e.target.value; B.schritt = 0; B.angebote = null; belohnung(); };
    $("#b-neu").onclick = () => { B.schritt = 0; B.angebote = null; belohnung(); };
    $("#b-voll").onclick = () => { S.sammlung = F.REIHE.slice(); S.runde = 3; speichern(); B.schritt = 0; B.angebote = null; belohnung(); };
    const w = $("#b-weiter"); if (w) w.onclick = () => { if (!S.enden.includes(schluessel)) { S.enden.push(schluessel); speichern(); } B.schritt = 2; belohnung(); };
    if (B.schritt === 2) $("#belohnung").querySelectorAll("#b-buehne .karte").forEach((k) => {
      const f = k.dataset.fid;
      k.onclick = () => !k.classList.contains("verdeckt") && detail(f, { einbuchen: () => {
        if (B.schritt !== 2 || !(B.angebote || []).includes(f)) { sperre = false; return; }
        B.schritt = 2.5; // Wahl läuft, kein zweites Mal
        [...document.querySelectorAll("#b-buehne .karte")].filter((x) => x !== k).forEach((x) => x.classList.add("weg")); k.classList.add("gewaehlt");
        setTimeout(() => einfliegen(k, f, () => { aufnehmen(f); B.schritt = 3; belohnung(); }), 650);
      } });
    });
    aufdecken(el); binden(el);
  }

  /* ---------- Navigation ---------- */
  const ANSICHT = { registrierung, start, sammlung, wahl, belohnung };
  function geh(a) {
    document.querySelectorAll("#ansichten button").forEach((b) => b.classList.toggle("an", b.dataset.a === a));
    document.querySelectorAll(".ansicht").forEach((s) => { s.hidden = s.id !== a; });
    ANSICHT[a](); window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + a); } catch (e) { /* egal */ }
  }
  function binden(el) { el.querySelectorAll("[data-geh]").forEach((b) => { b.onclick = () => geh(b.dataset.geh); }); el.querySelectorAll(".buehne:not(#reg-buehne):not(#b-buehne) .karte").forEach((k) => { k.onclick = () => detail(k.dataset.fid); }); }
  document.querySelectorAll("#ansichten button").forEach((b) => { b.onclick = () => geh(b.dataset.a); });
  $("#zuruecksetzen").onclick = () => { S = { sammlung: [], neu: [], runde: 0, angebote: null, gesehen: [], enden: [] }; WAHL = []; B = { kampagne: "rabenmoor", ende: "ende_erloest", schritt: 0, angebote: null }; speichern(); geh("registrierung"); };
  // Testhilfe: ?demo füllt eine Beispielsammlung
  if (/[?&]demo/.test(location.search) && !S.sammlung.length) { S.sammlung = ["schildwaechter", "elementarist", "trickser", "lichtbringer"]; S.runde = 3; speichern(); }
  const startAnsicht = (location.hash || "").slice(1);
  zaehler(); geh(ANSICHT[startAnsicht] ? startAnsicht : "registrierung");
  window.PROTO = { S: () => S, geh, B: () => B };
})();
</script>
</body>
</html>
