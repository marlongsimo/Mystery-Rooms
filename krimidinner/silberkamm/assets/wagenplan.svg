  <rect class="hall" x="20" y="268" width="600" height="26"/>
  <text class="floor" x="320.0" y="285" text-anchor="middle">Seitengang</text>
  <text class="wing" x="20" y="338">WAGEN 3 · SPEISEWAGEN</text>
  <rect class="wall" x="20" y="346" width="600" height="98" rx="6"/>
  <rect class="room" x="20" y="346" width="600" height="98" rx="6"/>
  <text class="t" x="90" y="398" text-anchor="middle">Bar</text>
  <rect class="hall" x="178" y="358" width="44" height="26" rx="3"/>
  <rect class="hall" x="178" y="394" width="44" height="26" rx="3"/>
  <rect class="hall" x="248" y="358" width="44" height="26" rx="3"/>
  <rect class="hall" x="248" y="394" width="44" height="26" rx="3"/>
  <rect class="hall" x="318" y="358" width="44" height="26" rx="3"/>
  <rect class="hall" x="318" y="394" width="44" height="26" rx="3"/>
  <rect class="hall" x="388" y="358" width="44" height="26" rx="3"/>
  <rect class="hall" x="388" y="394" width="44" height="26" rx="3"/>
  <text class="s" x="305" y="436" text-anchor="middle">Tische</text>
  <rect class="key" x="520" y="372" width="70" height="44" rx="4"/>
  <text class="t" x="555" y="399" text-anchor="middle">Klavier</text>
  <text class="floor" x="20" y="38">◄ LOK</text>
  <path class="walk" d="M614 131.0 C 634 161.0, 634 162, 320.0 166 S 6 176, 26 281.0"/>
  <path class="walk" d="M614 281.0 C 634 311.0, 634 312, 320.0 316 S 6 326, 26 406"/>
  <circle class="bell" cx="610" cy="208" r="6"/>
  <rect class="heat" x="185" y="254" width="9" height="9"/>
  <rect class="heat" x="305" y="254" width="9" height="9"/>
  <rect class="heat" x="425" y="254" width="9" height="9"/>
  <circle class="bell" cx="26" cy="466" r="6"/><text class="s" x="38" y="470">Läutwerk-Tafel (Abteile 6–8)</text>
  <rect class="heat" x="216" y="461" width="9" height="9"/><text class="s" x="232" y="470">Heizregler, nur mit Vierkant</text>
  <line class="walk" x1="412" y1="466" x2="440" y2="466"/><text class="s" x="446" y="470">Weg durch den Zug</text>
</svg>
