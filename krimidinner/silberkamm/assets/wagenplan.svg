<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" class="plan-svg" role="img" aria-label="Wagenplan des Silberkamm-Express: Schlafwagen, Salonwagen und Speisewagen mit Abteilen und Seitengang">
  <style>
    .wall { fill: #fbf6ea; stroke: #3b3122; stroke-width: 2.2; }
    .room { fill: #f3ead6; stroke: #6b5a3e; stroke-width: 1.2; }
    .key  { fill: #ead9b4; stroke: #6b5a3e; stroke-width: 1.2; }
    .hall { fill: #e7dcc2; stroke: #6b5a3e; stroke-width: 1; }
    .t { font: 600 13px "DM Sans", Arial, sans-serif; fill: #231e14; }
    .s { font: 11px "DM Sans", Arial, sans-serif; fill: #4a3f2c; }
    .wing { font: 700 12px "DM Mono", monospace; letter-spacing: .14em; fill: #7a6233; }
    .floor { font: 11px "DM Mono", monospace; fill: #7a6233; }
    .bell { fill: #9e2b25; stroke: #fff; stroke-width: 1; }
    .heat { fill: #2c4a7a; stroke: #fff; stroke-width: 1; }
    .walk { fill: none; stroke: #9e2b25; stroke-width: 1.6; stroke-dasharray: 5 4; }
  </style>
  <text class="wing" x="76" y="38">WAGEN 1 · SCHLAFWAGEN</text>
  <rect class="wall" x="20" y="46" width="600" height="98" rx="6"/>
  <rect class="key" x="20" y="46" width="120" height="72"/>
  <text class="t" x="80.0" y="76" text-anchor="middle">Dienstabteil</text>
  <text class="s" x="80.0" y="94" text-anchor="middle">Zugbegleitung</text>
  <rect class="room" x="140" y="46" width="120" height="72"/>
  <text class="t" x="200.0" y="76" text-anchor="middle">Abteil 1</text>
  <text class="s" x="200.0" y="94" text-anchor="middle">Hagen</text>
  <rect class="room" x="260" y="46" width="120" height="72"/>
  <text class="t" x="320.0" y="76" text-anchor="middle">Abteil 2</text>
  <text class="s" x="320.0" y="94" text-anchor="middle">Sattler</text>
  <rect class="room" x="380" y="46" width="120" height="72"/>
  <text class="t" x="440.0" y="76" text-anchor="middle">Abteil 3</text>
  <text class="s" x="440.0" y="94" text-anchor="middle">Reiter</text>
  <rect class="room" x="500" y="46" width="120" height="72"/>
  <text class="t" x="560.0" y="76" text-anchor="middle">Abteil 4</text>
  <text class="s" x="560.0" y="94" text-anchor="middle">Bell</text>
  <rect class="hall" x="20" y="118" width="600" height="26"/>
  <text class="floor" x="320.0" y="135" text-anchor="middle">Seitengang</text>
  <text class="wing" x="20" y="188">WAGEN 2 · SALONWAGEN</text>
  <rect class="wall" x="20" y="196" width="600" height="98" rx="6"/>
  <rect class="room" x="20" y="196" width="180" height="72"/>
  <text class="t" x="110.0" y="226" text-anchor="middle">Salon 6</text>
  <text class="s" x="110.0" y="244" text-anchor="middle">v. Auen</text>
