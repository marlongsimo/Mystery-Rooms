  <script>
    /* Umzug: Mythara liegt jetzt unter mythara-dungeon.de. Wer das Spiel noch über Case Unlocked öffnet, wird dorthin geleitet –
       aber nur, wenn die neue Adresse sicher (https) antwortet. Sonst bleibt alles, wie es ist. Unter der neuen Adresse tut das Skript nichts. */
    (function () {
      if (!/(^|\.)case-unlocked\.de$/.test(location.hostname)) return;
      var neu = "https://mythara-dungeon.de/", ziel = neu + (location.pathname.split("/").pop() || "index.html") + location.search + location.hash;
      fetch(neu + "verbindung.js", { mode: "no-cors", cache: "no-store" }).then(function () { location.replace(ziel); }).catch(function () { /* neue Adresse nicht erreichbar: hier weiterspielen */ });
    })();
  </script>
