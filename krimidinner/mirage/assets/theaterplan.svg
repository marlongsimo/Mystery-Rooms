<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" class="plan-svg" role="img" aria-label="Plan des Palais Mirage: Bühne mit Spiegelkabinett, Seitenbühnen, Zuschauerraum, Foyer und Unterbühne">
  <style>
    .wall { fill: #fbf6ea; stroke: #3b3122; stroke-width: 2.2; }
